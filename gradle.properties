# Gradle 构建进程的最大堆内存，供 Minecraft 开发依赖处理使用。
# Maximum heap memory for the Gradle build process and Minecraft development dependency processing.
org.gradle.jvmargs=-Xmx3G

# 默认不保留 Gradle 守护进程。
# Do not keep a persistent Gradle daemon by default.
org.gradle.daemon=false

# 模组注册名及资源命名空间。
# Mod identifier and resource namespace.
mod_id=combatrolantique

# 模组英文名称。
# English mod name.
mod_name=Combat Rol Antique

# 模组版本号。
# Mod version.
mod_version=1.0.0

# 模组构建的 Maven 组名。
# Maven group for the mod build.
mod_group=xy177.combatrolantique

# 目标 Minecraft 版本。
# Target Minecraft version.
minecraft_version=1.12.2

# 编译所用 Forge 版本；不代表模组加载时的 Forge 版本要求。
# Forge version used for compilation; this does not impose a Forge version requirement when loading the mod.
forge_version=14.23.5.2864
